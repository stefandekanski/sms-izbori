<!DOCTYPE html>
<html lang="sr-Latn" translate="no">
<head>
  <meta charset="utf-8">
  <!-- Chrome on a phone set to English offers to translate the page ("Bosnian to English"); translated, the
       buttons no longer match their names in the guide and the video. -->
  <meta name="google" content="notranslate">
  <title>SMS Izbori</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1E4C8F" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-any.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- iOS before 16.4 opens a home screen icon as a full screen app only with this. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/ui.js"></script>
</head>
<body>
  <div id="app"></div>
  <!-- Until the app draws its first screen: on a slow network the first visit takes a few seconds (after
       that the worker serves it at once). It shows only after half a second, so a quick start doesn't flash
       it, and styles.css hides it once #app has anything in it. -->
  <div class="boot" role="status">
    <img src="icons/icon-any.svg" alt="" width="72" height="72">
    <svg class="boot-spinner" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><circle cx="24" cy="24" r="20"/></svg>
    <div>Učitava se…</div>
    <div class="boot-slow">Ako dugo traje, proveri internet i otvori ponovo.</div>
  </div>
  <noscript>Za rad aplikacije SMS Izbori potreban je JavaScript.</noscript>
</body>
</html>
